<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>iPhones — WeBuyApple</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#FAFAFA;
      --surface:#FFFFFF;
      --muted:#64748B;
      --accent:#3B82F6;
      --accent-600:#1E66E6;
      --success:#10B981;
      --text:#1F1F24;
      --card-w:280px;
      --card-img-h:180px;
      --transition:0.25s ease;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      font-family: "Inter", sans-serif;
      margin:0;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.35;
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}

    /* NAVBAR */
    .navbar{
      width:100%;
      position:fixed;
      top:0;left:0;
      z-index:1000;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:14px 26px;
      background:var(--surface);
      border-bottom:1px solid #F4F4F5;
      box-shadow:0 2px 10px rgba(15,15,15,0.02);
    }
    .logo img{height:40px}
    .nav-links{display:flex;gap:18px;align-items:center}
    .nav-links a{font-size:14px}
    .cta-btn{background:var(--accent);color:#fff;padding:8px 14px;border-radius:8px;font-weight:600}

    /* HERO */
    .hero{
      margin-top:76px;
      padding:36px 26px;
      border-bottom:1px solid #F4F4F5;
      background:linear-gradient(90deg, rgba(59,130,246,0.08), rgba(16,185,129,0.03));
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      flex-wrap:wrap;
    }
    .hero-left h1{font-size:28px;margin:0 0 8px 0;font-weight:700}
    .hero-left p{margin:0;color:var(--muted)}
    .hero-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

    /* CONTROLS */
    .controls{
      display:flex;
      gap:12px;
      align-items:center;
      width:100%;
      margin-top:12px;
    }
    .search {
      flex:1;
      display:flex;
      align-items:center;
      gap:8px;
      background:#fff;
      padding:8px 10px;
      border-radius:10px;
      border:1px solid #EEF2FF;
      box-shadow:0 2px 6px rgba(15,15,15,0.02);
    }
    .search input{
      border:0;outline:0;font-size:14px;width:100%;
    }
    .controls .btn {
      background:var(--surface);
      border:1px solid #E6EEF9;
      padding:8px 12px;border-radius:10px;
      cursor:pointer;font-weight:600;
    }
    .controls .btn.primary{
      background:var(--accent);color:#fff;border:none;
    }
    .sort-select{
      background:var(--surface);
      border:1px solid #E6EEF9;
      padding:8px 10px;border-radius:10px;
      display:flex;gap:8px;align-items:center;
    }

    /* LAYOUT */
    .container{
      display:grid;
      grid-template-columns: 1fr;
      gap:24px;
      padding:24px;
      max-width:1200px;
      margin:0 auto 60px;
    }

    /* PRODUCT GRID */
    .product-grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(var(--card-w), 1fr));
      gap:22px;
      align-items:start;
    }

    .product-card{
      background:var(--surface);
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 6px 18px rgba(12,12,12,0.04);
      transition: transform var(--transition), box-shadow var(--transition);
      max-width:var(--card-w);
      margin:0 auto;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .product-card:hover{
      transform:translateY(-6px);
      box-shadow:0 18px 46px rgba(12,12,12,0.08);
    }
    .product-card .thumb{
      width:100%;
      height:var(--card-img-h);
      overflow:hidden;
      background:#f6f7fb;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:64px;
    }
    .product-card .thumb img{width:100%;height:100%;object-fit:cover}

    .product-card .card-body{
      padding:12px 14px 16px 14px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .product-card h3{font-size:16px;margin:0;color:var(--text)}
    .product-card p{margin:0;font-size:13px;color:var(--muted)}
    .product-card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
    .price{font-weight:700;color:var(--text)}
    .condition{font-size:12px;padding:6px 8px;border-radius:8px;background:#F8FAFC;color:var(--muted);border:1px solid #F1F5F9}

    .product-card .actions{
      padding:12px 14px 16px 14px;
      border-top:1px solid #F4F4F5;
      display:flex;
      justify-content:space-between;
      gap:8px;
    }
    .view-more{
      display:inline-block;
      margin:0;
      padding:10px 14px;
      background:var(--accent);
      color:#fff;
      font-size:14px;
      font-weight:600;
      border-radius:8px;
      text-align:center;
      flex:1;
      text-decoration:none;
      transition:transform var(--transition), box-shadow var(--transition), background var(--transition);
    }
    .view-more:hover{background:var(--accent-600);transform:translateY(-3px);box-shadow:0 8px 20px rgba(16,24,40,0.08)}

    /* FOOTER */
    .footer{padding:32px;text-align:center;color:var(--muted);font-size:14px;margin-top:20px;border-top:1px solid #F4F4F5}

    /* RESPONSIVE */
    @media(max-width:720px){
      .hero-left h1{font-size:20px}
      .controls{flex-direction:column;align-items:stretch}
      .controls .btn{width:100%}
      .product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      :root{--card-w:165px;--card-img-h:140px}
    }
    @media(max-width:420px){
      .product-grid{grid-template-columns:repeat(1,minmax(0,1fr))}
      :root{--card-w:100%;--card-img-h:160px}
      .navbar{padding:10px 14px}
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar" role="banner">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="logo">
        <img src="https://webuyapple.co.za/wp-content/uploads/2022/07/WBA-Logo-2.png" alt="WeBuyApple">
      </div>
      <nav class="nav-links" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="Iphones.html">iPhones</a>
        <a href="Macbook.html">MacBooks</a>
        <a href="sell.html">Sell Device</a>
      </nav>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <a class="cta-btn" href="sell.html">Sell Device</a>
    </div>
  </header>

  <!-- HERO + CONTROLS -->
  <section class="hero" aria-labelledby="shop-title">
    <div class="hero-left">
      <h1 id="shop-title">iPhones — Shop Premium Refurbished & Used</h1>
      <p>Browse our collection of iPhone models. All devices tested and certified.</p>
      <div class="controls" style="margin-top:12px;">
        <div class="search" role="search" aria-label="Search products">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="opacity:.6"><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <input id="searchInput" type="search" placeholder="Search iPhone model, storage, year..." />
        </div>

        <div class="sort-select">
          <label for="sortBy" style="font-weight:700;font-size:13px;color:var(--muted)">Sort</label>
          <select id="sortBy" style="border:0;background:transparent;outline:none;font-weight:700">
            <option value="featured">Featured</option>
            <option value="newest">Newest → Oldest</option>
            <option value="oldest">Oldest → Newest</option>
            <option value="price-low">Price: Low → High</option>
            <option value="price-high">Price: High → Low</option>
          </select>
        </div>
      </div>
    </div>

    <div class="hero-actions">
      <a class="btn" href="#" style="background:var(--surface);border:1px solid #E6EEF9;padding:10px 12px;border-radius:10px;font-weight:700">Compare</a>
      <a class="btn primary" href="sell.html">Sell Your iPhone</a>
    </div>
  </section>

  <!-- MAIN CONTENT -->
  <main class="container" id="main">
    <section>
      <div id="productGrid" class="product-grid" aria-live="polite">
        <!-- Products rendered here -->
      </div>
    </section>
  </main>

  <footer class="footer">
    © <span id="year"></span> WeBuyApple — Refurbished & Used iPhones
  </footer>

  <script>
    // iPhone inventory data
    const iphones = [
      { id:1, model:'iPhone 15 Pro', storage:'256GB', year:'2023', condition:'Excellent', price:18999, image:'https://webuyapple.co.za/wp-content/uploads/2025/10/iphone_15_pro_max_blue_titanium_pdp_image_position-1__wwen_1.jpg'},
      { id:2, model:'iPhone 15 Pro Max', storage:'512GB', year:'2023', condition:'Like New', price:22999, image:'https://webuyapple.co.za/wp-content/uploads/2025/10/iphone_15_pro_max_blue_titanium_pdp_image_position-1__wwen_1.jpg' },
      { id:3, model:'iPhone 14', storage:'128GB', year:'2022', condition:'Excellent', price:13999, image:'https://webuyapple.co.za/wp-content/uploads/2025/09/iphone_14_pro_max_gold_pdp_image_position-1a__wwen_2_2.png' },
      { id:4, model:'iPhone 14 Plus', storage:'256GB', year:'2022', condition:'Good', price:14999, image:'https://webuyapple.co.za/wp-content/uploads/2025/09/iphone_14_pro_max_gold_pdp_image_position-1a__wwen_2_2.png' },
      { id:5, model:'iPhone 13', storage:'128GB', year:'2021', condition:'Like New', price:11999, image:'https://webuyapple.co.za/wp-content/uploads/2025/09/iphone_13_midnight_pure_back_iphone_13_midnight_pure_front_2-up_screen__usen_9.jpg' },
      { id:7, model:'iPhone XS', storage:'128GB', year:'2022', condition:'Excellent', price:7499, image:'https://webuyapple.co.za/wp-content/uploads/2025/09/iphone-xs-max-silver_3.jpg' },
      { id:8, model:'iPhone 11', storage:'64GB', year:'2019', condition:'Good', price:5999, image:'https://webuyapple.co.za/wp-content/uploads/2024/10/iPhone_11_Black-1024x1024.webp' },
      { id:9, model:'iPhone 12', storage:'128GB', year:'2020', condition:'Good', price:5999, image:'https://webuyapple.co.za/wp-content/uploads/2024/11/iPhone_12_Pro_Graphite_PDP_Image_Position-2__en-US_1-1024x1024.webp' },
      { id:10, model:'iPhone 11', storage:'128GB', year:'2019', condition:'Good', price:5999, image:'https://webuyapple.co.za/wp-content/uploads/2024/10/iPhone_11_Green-1024x1024.webp' },
    ];

    let searchTerm = '';
    let sortBy = 'featured';

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      let displayed = [...iphones];

      // Apply search
      if(searchTerm){
        displayed = displayed.filter(ip =>
          ip.model.toLowerCase().includes(searchTerm.toLowerCase()) ||
          ip.storage.toLowerCase().includes(searchTerm.toLowerCase()) ||
          ip.year.toLowerCase().includes(searchTerm.toLowerCase())
        );
      }

      // Apply sorting
      switch(sortBy){
        case 'newest': displayed.sort((a,b)=>b.year - a.year); break;
        case 'oldest': displayed.sort((a,b)=>a.year - b.year); break;
        case 'price-low': displayed.sort((a,b)=>a.price - b.price); break;
        case 'price-high': displayed.sort((a,b)=>b.price - a.price); break;
        default: displayed.sort((a,b)=>a.id - b.id); break; // Featured
      }

      if(displayed.length === 0){
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">No iPhones found matching your criteria.</div>';
        return;
      }

      grid.innerHTML = displayed.map(ip => `
        <article class="product-card">
          <div class="thumb">
            <img src="${ip.image}" alt="${ip.model}">
          </div>
          <div class="card-body">
            <h3>${ip.model}</h3>
            <p>${ip.storage} • ${ip.year}</p>
            <div class="meta">
              <span class="price">${ip.price.toLocaleString('en-ZA', {style:'currency',currency:'ZAR'})}</span>
              <span class="condition">${ip.condition}</span>
            </div>
          </div>
          <div class="actions">
            <a href="sell.html" class="view-more" aria-label="Get quote for ${ip.model}">Get Quote</a>
          </div>
        </article>
      `).join('');
    }

    // Search
    document.getElementById('searchInput').addEventListener('input', (e)=>{
      searchTerm = e.target.value;
      renderProducts();
    });

    // Sort
    document.getElementById('sortBy').addEventListener('change', (e)=>{
      sortBy = e.target.value;
      renderProducts();
    });

    // Set year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Initial render
    renderProducts();
  </script>
</body>
</html>
