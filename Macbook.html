<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MacBooks — WeBuyApple</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#FAFAFA;
      --surface:#FFFFFF;
      --muted:#64748B;
      --accent:#3B82F6;
      --accent-600:#1E66E6;
      --success:#10B981;
      --text:#1F1F24;
      --card-w:280px;
      --card-img-h:180px;
      --transition:0.25s ease;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      font-family: "Inter", sans-serif;
      margin:0;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.35;
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}

    /* NAVBAR */
    .navbar{
      width:100%;
      position:fixed;
      top:0;left:0;
      z-index:1000;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:14px 26px;
      background:var(--surface);
      border-bottom:1px solid #F4F4F5;
      box-shadow:0 2px 10px rgba(15,15,15,0.02);
    }
    .logo img{height:40px}
    .nav-links{display:flex;gap:18px;align-items:center}
    .nav-links a{font-size:14px}
    .cta-btn{background:var(--accent);color:#fff;padding:8px 14px;border-radius:8px;font-weight:600}

    /* HERO */
    .hero{
      margin-top:76px;
      padding:36px 26px;
      border-bottom:1px solid #F4F4F5;
      background:linear-gradient(90deg, rgba(59,130,246,0.08), rgba(16,185,129,0.03));
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      flex-wrap:wrap;
    }
    .hero-left h1{font-size:28px;margin:0 0 8px 0;font-weight:700}
    .hero-left p{margin:0;color:var(--muted)}
    .hero-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

    /* CONTROLS */
    .controls{
      display:flex;
      gap:12px;
      align-items:center;
      width:100%;
      margin-top:12px;
    }
    .search {
      flex:1;
      display:flex;
      align-items:center;
      gap:8px;
      background:#fff;
      padding:8px 10px;
      border-radius:10px;
      border:1px solid #EEF2FF;
      box-shadow:0 2px 6px rgba(15,15,15,0.02);
    }
    .search input{
      border:0;outline:0;font-size:14px;width:100%;
    }
    .controls .btn {
      background:var(--surface);
      border:1px solid #E6EEF9;
      padding:8px 12px;border-radius:10px;
      cursor:pointer;font-weight:600;
    }
    .controls .btn.primary{
      background:var(--accent);color:#fff;border:none;
    }
    .sort-select{
      background:var(--surface);
      border:1px solid #E6EEF9;
      padding:8px 10px;border-radius:10px;
      display:flex;gap:8px;align-items:center;
    }

    /* LAYOUT */
    .container{
      display:grid;
      grid-template-columns: 1fr;
      gap:24px;
      padding:24px;
      max-width:1200px;
      margin:0 auto 60px;
    }

    /* PRODUCT GRID */
    .product-grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(var(--card-w), 1fr));
      gap:22px;
      align-items:start;
    }

    .product-card{
      background:var(--surface);
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 6px 18px rgba(12,12,12,0.04);
      transition: transform var(--transition), box-shadow var(--transition);
      max-width:var(--card-w);
      margin:0 auto;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .product-card:hover{
      transform:translateY(-6px);
      box-shadow:0 18px 46px rgba(12,12,12,0.08);
    }
    .product-card .thumb{
      width:100%;
      height:var(--card-img-h);
      overflow:hidden;
      background:#f6f7fb;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:64px;
    }
    .product-card .thumb img{width:100%;height:100%;object-fit:cover}

    .product-card .card-body{
      padding:12px 14px 16px 14px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .product-card h3{font-size:16px;margin:0;color:var(--text)}
    .product-card p{margin:0;font-size:13px;color:var(--muted)}
    .product-card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
    .price{font-weight:700;color:var(--text)}
    .condition{font-size:12px;padding:6px 8px;border-radius:8px;background:#F8FAFC;color:var(--muted);border:1px solid #F1F5F9}

    .product-card .actions{
      padding:12px 14px 16px 14px;
      border-top:1px solid #F4F4F5;
      display:flex;
      justify-content:space-between;
      gap:8px;
    }
    .view-more{
      display:inline-block;
      margin:0;
      padding:10px 14px;
      background:var(--accent);
      color:#fff;
      font-size:14px;
      font-weight:600;
      border-radius:8px;
      text-align:center;
      flex:1;
      text-decoration:none;
      transition:transform var(--transition), box-shadow var(--transition), background var(--transition);
    }
    .view-more:hover{background:var(--accent-600);transform:translateY(-3px);box-shadow:0 8px 20px rgba(16,24,40,0.08)}

    /* FOOTER */
    .footer{padding:32px;text-align:center;color:var(--muted);font-size:14px;margin-top:20px;border-top:1px solid #F4F4F5}

    /* RESPONSIVE */
    @media(max-width:720px){
      .hero-left h1{font-size:20px}
      .controls{flex-direction:column;align-items:stretch}
      .controls .btn{width:100%}
      .product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      :root{--card-w:165px;--card-img-h:140px}
    }
    @media(max-width:420px){
      .product-grid{grid-template-columns:repeat(1,minmax(0,1fr))}
      :root{--card-w:100%;--card-img-h:160px}
      .navbar{padding:10px 14px}
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar" role="banner">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="logo">
        <img src="https://webuyapple.co.za/wp-content/uploads/2022/07/WBA-Logo-2.png" alt="WeBuyApple">
      </div>
      <nav class="nav-links" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="Iphones.html">iPhones</a>
        <a href="Macbook.html">MacBooks</a>
        <a href="sell.html">Sell Device</a>
      </nav>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <a class="cta-btn" href="sell.html">Sell Device</a>
    </div>
  </header>

  <!-- HERO + CONTROLS -->
  <section class="hero" aria-labelledby="shop-title">
    <div class="hero-left">
      <h1 id="shop-title">MacBooks — Shop Premium Refurbished & Used</h1>
      <p>Browse our collection of MacBook models. All devices tested and certified.</p>
      <div class="controls" style="margin-top:12px;">
        <div class="search" role="search" aria-label="Search products">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="opacity:.6"><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <input id="searchInput" type="search" placeholder="Search MacBook model, year, storage..." />
        </div>

        <div class="sort-select">
          <label for="sortBy" style="font-weight:700;font-size:13px;color:var(--muted)">Sort</label>
          <select id="sortBy" style="border:0;background:transparent;outline:none;font-weight:700">
            <option value="featured">Featured</option>
            <option value="newest">Newest → Oldest</option>
            <option value="oldest">Oldest → Newest</option>
            <option value="price-low">Price: Low → High</option>
            <option value="price-high">Price: High → Low</option>
          </select>
        </div>
      </div>
    </div>

    <div class="hero-actions">
      <a class="btn" href="#" style="background:var(--surface);border:1px solid #E6EEF9;padding:10px 12px;border-radius:10px;font-weight:700">Compare</a>
      <a class="btn primary" href="sell.html">Sell Your MacBook</a>
    </div>
  </section>

  <!-- MAIN CONTENT -->
  <main class="container" id="main">
    <section>
      <div id="productGrid" class="product-grid" aria-live="polite">
        <!-- Products rendered here -->
      </div>
    </section>
  </main>

  <footer class="footer">
    © <span id="year"></span> WeBuyApple — Refurbished & Used MacBooks
  </footer>

  <script>
    // MacBook inventory
    const macbooks = [
      { id:1, model:'MacBook Air"', storage:'128GB', year:'2018', condition:'Excellent', price:34999, image:'https://webuyapple.co.za/wp-content/uploads/2025/10/csm_DSC03635_473685c53c-1024x682.jpg' },
      { id:2, model:'MacBook Pro 14"', storage:'500GB', year:'2020', condition:'Like New', price:39999, image:'https://webuyapple.co.za/wp-content/uploads/2024/10/mr932plg-c.png' },
    ];

    let searchTerm = '';
    let sortBy = 'featured';

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      let displayed = [...macbooks];

      // Search filter
      if(searchTerm){
        displayed = displayed.filter(mb =>
          mb.model.toLowerCase().includes(searchTerm.toLowerCase()) ||
          mb.storage.toLowerCase().includes(searchTerm.toLowerCase()) ||
          mb.year.toLowerCase().includes(searchTerm.toLowerCase())
        );
      }

      // Sorting
      switch(sortBy){
        case 'newest': displayed.sort((a,b)=>b.year - a.year); break;
        case 'oldest': displayed.sort((a,b)=>a.year - b.year); break;
        case 'price-low': displayed.sort((a,b)=>a.price - b.price); break;
        case 'price-high': displayed.sort((a,b)=>b.price - a.price); break;
        default: displayed.sort((a,b)=>a.id - b.id); break;
      }

      if(displayed.length === 0){
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">No MacBooks found matching your criteria.</div>';
        return;
      }

      grid.innerHTML = displayed.map(mb => `
        <article class="product-card">
          <div class="thumb">
            <img src="${mb.image}" alt="${mb.model}">
          </div>
          <div class="card-body">
            <h3>${mb.model}</h3>
            <p>${mb.storage} • ${mb.year}</p>
            <div class="meta">
              <span class="price">${mb.price.toLocaleString('en-ZA', {style:'currency',currency:'ZAR'})}</span>
              <span class="condition">${mb.condition}</span>
            </div>
          </div>
          <div class="actions">
            <a href="sell.html" class="view-more" aria-label="Get quote for ${mb.model}">Get Quote</a>
          </div>
        </article>
      `).join('');
    }

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', e=>{
      searchTerm = e.target.value;
      renderProducts();
    });
    document.getElementById('sortBy').addEventListener('change', e=>{
      sortBy = e.target.value;
      renderProducts();
    });

    // Set year in footer
    document.getElementById('year').textContent = new Date().getFullYear();

    // Initial render
    renderProducts();
  </script>
</body>
</html>
